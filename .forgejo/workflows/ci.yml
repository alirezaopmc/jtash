name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: vps
    steps:
      - name: Lint, typecheck, build
        run: |
          set -euo pipefail
          runuser -u opmc -- \
            /home/opmc/Dev/Manova/orbit/orbit-infra/scripts/ci-host-ts.sh \
            /home/opmc/Dev/Manova/clients/jtash/frontend \
            "${{ forgejo.sha }}" "${{ forgejo.run_id }}"
