name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
      - name: Configure Verdaccio auth
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//npm.dev.manova.space/:_authToken=${NPM_TOKEN}" >> .npmrc
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
