name: CI

# Dev stage (ADR-076): CI runs only on release and Renovate pull requests and manual runs.
# Deploys live in deploy.yml and do not wait for this workflow.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--') || startsWith(github.head_ref, 'changeset-release/') || startsWith(github.head_ref, 'renovate/')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: manovaspace/ci@v1
        with:
          stack: ts
          # No test suite yet; drop this once `bun run test` exists.
          skip-tests: "true"
