name: CI

# Public repository: CI runs on every pull request and push to main. Deploys live in deploy.yml and do not wait for CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: manovaspace/ci@v1
        with:
          stack: ts
          # No test suite yet; drop this once `bun run test` exists.
          skip-tests: "true"
